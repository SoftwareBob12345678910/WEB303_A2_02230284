$kind: http-request
name: 'Session missing observer -> 400'
order: 9000
method: POST
url: '{{baseUrl}}/sessions'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "telescope_id": "{{telescopeId}}",
      "date": "{{sessionDate}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
