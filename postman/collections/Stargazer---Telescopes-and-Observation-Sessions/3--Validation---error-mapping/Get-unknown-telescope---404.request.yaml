$kind: http-request
name: 'Get unknown telescope -> 404'
order: 5000
method: GET
url: '{{baseUrl}}/telescopes/11111111-1111-4111-8111-111111111111'
headers:
  - key: Content-Type
    value: application/json
scripts:
