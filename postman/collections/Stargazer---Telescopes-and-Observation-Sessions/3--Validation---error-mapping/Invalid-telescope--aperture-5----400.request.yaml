$kind: http-request
name: 'Invalid telescope (aperture 5) -> 400'
order: 1000
method: POST
url: '{{baseUrl}}/telescopes'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Tiny",
      "aperture_mm": 5,
      "type": "REFLECTOR"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
