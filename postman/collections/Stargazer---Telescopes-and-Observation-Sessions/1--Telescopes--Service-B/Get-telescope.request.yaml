$kind: http-request
name: 'Get telescope'
order: 3000
method: GET
url: '{{baseUrl}}/telescopes/{{telescopeId}}'
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
