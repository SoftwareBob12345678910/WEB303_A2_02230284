$kind: http-request
name: 'Get session (enriched)'
order: 4000
method: GET
url: '{{baseUrl}}/sessions/{{sessionId}}'
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
