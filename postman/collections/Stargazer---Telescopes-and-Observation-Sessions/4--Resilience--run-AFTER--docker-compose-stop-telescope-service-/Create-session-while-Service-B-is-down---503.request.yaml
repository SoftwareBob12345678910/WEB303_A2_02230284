$kind: http-request
name: 'Create session while Service B is down -> 503'
order: 1000
method: POST
url: '{{baseUrl}}/sessions'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "telescope_id": "{{telescopeId}}",
      "observer": "Chen",
      "date": "{{sessionDate2}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 503", function () { pm.response.to.have.status(503); });
